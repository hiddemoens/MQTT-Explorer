name: Fork desktop release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'hiddemoens/MQTT-Explorer'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: mac
          - runner: windows-latest
            platform: win
          - runner: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.runner }}
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          npm ci --include=dev --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npx --yes yarn@1.22.22 --cwd app install --frozen-lockfile --ignore-scripts --non-interactive --production=false
      - name: Build desktop app
        shell: bash
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          npm run build:system-certificates
          node node_modules/typescript/bin/tsc
          npm --prefix app run build
      - name: Package desktop downloads
        run: node scripts/packageSystemTrust.cjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          path: |
            build/downloads/MQTT-Explorer-*.dmg
            build/downloads/MQTT-Explorer-*.zip
            build/downloads/MQTT-Explorer-*.exe
            build/downloads/MQTT-Explorer-*.AppImage
            build/downloads/MQTT-Explorer-*.tar.gz

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: downloads
      - name: Publish GitHub release
        working-directory: downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prefix="MQTT-Explorer-$version"
          assets=(
            "$prefix-mac-arm64.dmg" "$prefix-mac-arm64.zip"
            "$prefix-mac-x64.dmg" "$prefix-mac-x64.zip"
            "$prefix-windows-x64-setup.exe" "$prefix-windows-x64-portable.exe"
            "$prefix-linux-x86_64.AppImage" "$prefix-linux-x64.tar.gz"
          )
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "MQTT Explorer Fork $version"
